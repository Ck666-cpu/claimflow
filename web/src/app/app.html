<header class="topbar">
  <a class="brand" [routerLink]="session.home()">ClaimFlow</a>

  @if (session.user(); as user) {
    <nav class="nav">
      @if (session.isClaimant()) {
        <a routerLink="/claims" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">My claims</a>
        <a routerLink="/claims/new" routerLinkActive="active">Report an incident</a>
      } @else {
        <a routerLink="/work/queue" routerLinkActive="active">Queue</a>
        <a routerLink="/work/mine" routerLinkActive="active">{{ user.role === 'LEAD' ? 'Open claims' : 'My claims' }}</a>
        <a routerLink="/work/dashboard" routerLinkActive="active">Dashboard</a>
      }
    </nav>

    <div class="who">
      @if (session.isClaimant()) {
        <app-notifications-bell />
      }
      <span class="user">
        <strong>{{ user.name }}</strong>
        <span class="role">{{ roleLabels[user.role] }}</span>
      </span>
      <a routerLink="/login" class="switch">Switch user</a>
    </div>
  }
</header>

<main class="page">
  <app-error-banner />
  <router-outlet />
</main>
