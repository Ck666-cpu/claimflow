server:
  port: 8081

spring:
  application:
    name: notification-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claimflow}
    username: ${DB_USER:claimflow}
    password: ${DB_PASSWORD:claimflow}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notifications

  flyway:
    enabled: true
    schemas: notifications      # own schema: this service never reads claims tables
    default-schema: notifications

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false # offset committed only after the listener finishes
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:                   # only used to forward failed records to claims.events.DLT, unchanged
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info

claimflow:
  events-topic: claims.events
  events-replication: 1         # for claims.events.DLT; local single broker, production 3
